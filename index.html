<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NFL Market"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>NFL Market Dashboard</title></head><body>
<header class="topbar"><div><div class="eyebrow">NFL MARKET DASHBOARD</div><h1>Market Board</h1></div><button id="refreshBtn" class="iconbtn">↻</button></header>
<main><section class="hero card"><div><div class="muted">MARKET STATUS</div><div id="slateStatus" class="heroValue">Demo slate</div></div><div class="pill" id="dataMode">DEMO</div></section>
<section id="bestBetsSection"><div class="sectionHead"><h2>🔥 Best Bets</h2><span id="bestCount" class="muted"></span></div><div id="bestBets" class="stack"></div></section>
<section id="gamesSection"><div class="sectionHead"><h2>🏈 Games</h2><span id="gameCount" class="muted"></span></div><div id="games" class="stack"></div></section>
<section id="marketsSection"><div class="sectionHead"><h2>📈 Market Movement</h2></div><div id="movement" class="stack"></div></section>
<section id="settingsSection"><div class="sectionHead"><h2>⚙️ Settings</h2></div><div class="card settings"><label>Odds API key<input id="apiKey" type="password" placeholder="Optional"></label><label>Minimum spread edge<input id="minSpreadEdge" type="number" step=".1" value="2"></label><label>Minimum total edge<input id="minTotalEdge" type="number" step=".1" value="3"></label><label>Minimum Best Bet score<input id="minScore" type="number" value="72"></label><button id="saveSettings" class="primary">Save settings</button><p class="tiny">Your settings stay in this browser. V0.2 includes transparent demo model logic; the live model/data layer comes next.</p></div></section></main>
<nav class="tabbar"><button data-target="bestBetsSection" class="active">🔥<span>Best Bets</span></button><button data-target="gamesSection">🏈<span>Games</span></button><button data-target="marketsSection">📈<span>Markets</span></button><button data-target="settingsSection">⚙️<span>Settings</span></button></nav><script src="app.js"></script></body></html>
